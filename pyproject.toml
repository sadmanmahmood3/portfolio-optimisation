[project]
name = "portfolio-optimisation"
version = "0.1.0"
description = ""
authors = [
    {name = "Sadman Mahmood"}
]
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas (>=3.0.6,<4.0.0)",
    "yfinance (>=1.7.0,<2.0.0)",
    "prophet (>=1.4.0,<2.0.0)",
    "scipy (>=1.18.1,<2.0.0)",
    "streamlit (>=1.64.0,<2.0.0)",
    "supabase (>=2.31.0,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
pythonpath = ["."]